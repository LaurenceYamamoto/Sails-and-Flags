[package]
name = "sails-flags-core"
version = "4.1.5"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
rayon = { version = "1.11", optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"], optional = true }

[features]
shared-threads = ["dep:rayon", "dep:wasm-bindgen", "dep:wasm-bindgen-rayon"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
